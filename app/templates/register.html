<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - LAN LLM</title>
  <link rel="stylesheet" href="/static/styles.css?v=2">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: white;
      font-family: 'Inter', sans-serif;
    }
    .auth-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      z-index: 10;
    }
    /* Glow circles in background */
    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
    }
    .glow-1 { top: -50px; left: -50px; width: 200px; height: 200px; background: rgba(99, 102, 241, 0.3); }
    .glow-2 { bottom: -50px; right: -50px; width: 250px; height: 250px; background: rgba(139, 92, 246, 0.2); }
    
    .auth-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      color: #fff;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .auth-header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    
    .input-group {
      margin-bottom: 1.25rem;
    }
    .input-group label {
      display: block;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
    }
    .input-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }
    .input-group input::placeholder {
      color: #475569;
    }
    .input-group input:focus {
      border-color: #818cf8;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }
    
    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      margin-top: 1rem;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }
    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    
    .auth-links {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .auth-links a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .auth-links a:hover {
      color: #a5b4fc;
    }
  </style>
</head>
<body>

  <!-- Contenedor para toasts -->
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
    
    <div class="auth-card">
      <div class="auth-header">
        <h2>Crear Cuenta</h2>
        <p>Regístrate en LAN LLM Gateway</p>
      </div>
      
      <form id="registerForm">
        <div class="input-group">
          <label for="username">Correo electrónico</label>
          <input type="email" id="username" required placeholder="tu@correo.com" autocomplete="email">
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password">
        </div>
        <div class="input-group">
          <label for="password2">Confirmar contraseña</label>
          <input type="password" id="password2" required placeholder="Repite tu contraseña" minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" id="submitBtn" class="submit-btn">Registrarse</button>
      </form>
      
      <div class="auth-links">
        ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
      </div>
    </div>
  </div>

  <script>
    // Sistema de Toasts
    const TOAST_DURATION = 3500;
    function showToast(message, type = 'info', title = '') {
      const icons = {
        success: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
        error:   `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg>`,
        warning: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>`,
        info:    `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>`,
      };
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <span class="toast-icon">${icons[type] || icons.info}</span>
        <div class="toast-message">
          ${title ? `<div class="toast-title">${title}</div>` : ''}
          ${message}
        </div>
        <div class="toast-progress" style="animation-duration:${TOAST_DURATION}ms;"></div>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-out');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      }, TOAST_DURATION);
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      // Validar coincidencia de contraseñas en el cliente
      if (password !== password2) {
        showToast('Las contraseñas no coinciden.', 'warning', 'Atención');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Verificando...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: password
          })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || 'Error al registrarse');
        }

        showToast('Cuenta creada correctamente', 'success', '¡Registro exitoso!');
        // Redirigir al login tras registro exitoso
        setTimeout(() => {
          window.location.href = '/login';
        }, 1500);
      } catch (err) {
        showToast(err.message, 'error', 'Error al crear cuenta');
        btn.disabled = false;
        btn.innerText = 'Registrarse';
      }
    });
  </script>
</body>
</html>
